name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            RELEASE=/var/www/myapp/releases/$(date +%Y%m%d%H%M%S)
            git clone --depth 1 git@github.com:gryfklapryd/pld-mitra-example.git "$RELEASE"
            cd "$RELEASE"

            rm -rf storage
            ln -sfn /var/www/myapp/shared/.env .env
            ln -sfn /var/www/myapp/shared/storage storage

            composer install --no-dev --optimize-autoloader
            npm ci && npm run build

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force

            ln -sfn "$RELEASE" /var/www/myapp/current
            sudo systemctl reload php8.4-fpm

            # opsional: bersihin release lama, simpan 3 terakhir
            cd /var/www/myapp/releases && ls -t | tail -n +4 | xargs -r rm -rf